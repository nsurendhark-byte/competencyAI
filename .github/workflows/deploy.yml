# CompetencyAI Full-Stack Architecture Notice:
# CompetencyAI requires a Node.js server runtime for Next.js API endpoints (/api/*),
# HTTP-only cookies, authentication, database operations, and Gemini AI server integration.
# Static HTML export on GitHub Pages cannot run server API routes or cookies.
# To deploy CompetencyAI to production, connect this repository to Vercel (https://vercel.com).

name: Full-Stack Next.js Deployment Notice

on:
  push:
    branches:
      - main

jobs:
  build_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Full-Stack Build
        run: npm run build